<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nursing Syllabus Builder</title>
    <style>
        :root {
            --primary-color: #005A9C; /* Nursing / Clinical Blue */
            --secondary-color: #f4f7f9;
            --border-color: #cccccc;
            --text-color: #333333;
            --danger-color: #cc0000;
            --success-color: #28a745;
            --word-color: #2b579a; /* MS Word Blue */
            --clinical-color: #008080; /* Teal for Clinical toggle */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            line-height: 1.6;
            background-color: #e9eef2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px; 
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: max-width 0.3s;
        }

        .toolbar {
            background-color: var(--secondary-color);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            margin-top: 0;
        }

        .course-header-zone {
            margin-bottom: 20px;
            background: #fafafa;
            padding: 15px;
            border-radius: 6px;
            border-left: 5px solid var(--primary-color);
        }

        .interactive-field {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .display-mode {
            font-size: 1.1em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            cursor: pointer;
            padding: 6px 12px;
            border: 1px solid transparent;
            border-radius: 4px;
            font-weight: 6px;
            transition: all 0.2s;
        }

        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-success { background-color: var(--success-color); color: white; }
        .btn-word { background-color: var(--word-color); color: white; }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-clinical { background-color: var(--clinical-color); color: white; }

        button:hover { opacity: 0.9; }

        /* Syllabus Table Matrix */
        .syllabus-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            margin-bottom: 40px;
            table-layout: fixed;
        }

        .syllabus-table th, .syllabus-table td {
            border: 1px solid var(--border-color);
            padding: 15px;
            vertical-align: top;
            word-wrap: break-word;
        }

        .syllabus-table th {
            background-color: var(--primary-color);
            color: white;
            text-align: left;
        }

        .week-heading {
            background-color: #dee2e6;
            font-weight: bold;
            font-size: 1.2em;
            color: #495057;
            padding: 10px 15px !important;
        }

        .sub-section-title {
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 15px;
            margin-bottom: 5px;
            border-bottom: 1px dashed var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sub-section-title:first-child { margin-top: 0; }

        .list-container {
            margin-bottom: 15px;
            min-height: 30px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .item-text { flex-grow: 1; }

        .restore-panel {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        
        .restore-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
        }

        .bottom-actions {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        /* Weekly Objective tags */
        .wo-tag {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 1px 6px;
            border-radius: 10px;
            margin-right: 5px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Mapped WO tags shown on non-objective items */
        .wo-mapping-badge {
            display: inline-block;
            background-color: #e8f0fb;
            color: var(--primary-color);
            font-size: 10px;
            font-weight: bold;
            padding: 1px 6px;
            border-radius: 10px;
            margin-right: 3px;
            border: 1px solid #b3caf0;
            white-space: nowrap;
        }
        .wo-mapping-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-top: 3px;
        }

        /* Map button */
        .btn-map {
            background-color: #f0f4ff;
            color: #3a5fc8;
            border: 1px solid #b3caf0;
            padding: 2px 6px;
            font-size: 12px;
        }
        .btn-map:hover { background-color: #dce6ff; }

        /* Map popover */
        .map-popover-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .map-popover {
            background: white;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            padding: 20px 24px;
            min-width: 260px;
            max-width: 380px;
            width: 90%;
        }
        .map-popover h3 {
            margin: 0 0 6px 0;
            font-size: 14px;
            color: var(--primary-color);
        }
        .map-popover p {
            margin: 0 0 14px 0;
            font-size: 12px;
            color: #666;
        }
        .map-wo-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .map-wo-chip {
            padding: 5px 12px;
            border-radius: 14px;
            border: 2px solid var(--primary-color);
            background: white;
            color: var(--primary-color);
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s;
        }
        .map-wo-chip.selected {
            background: var(--primary-color);
            color: white;
        }
        .map-wo-chip:hover:not(.selected) { background: #e8f0fb; }
        .map-popover-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="container" id="syllabusContentContainer">
    <h1>Nursing Syllabus Builder</h1>
    
    <div class="toolbar" id="exclude-toolbar">
        <button class="btn-word" onclick="exportToWord()">📄 Export to Microsoft Word</button>
        <small style="color: #666; margin-left: auto;">*Changes auto-save directly to your browser window session memory.</small>
    </div>

    <div class="course-header-zone">
        <label style="font-weight: bold; display:block; margin-bottom: 5px;">Course Code & Name:</label>
        <div id="courseNameContainer">
            </div>
    </div>

    <div style="margin-bottom: 25px;" id="exclude-column-toggle-zone">
        <button id="columnToggleBtn" class="btn-clinical" onclick="toggleClinicalColumn()">Add Clinical Column</button>
    </div>

    <div id="weeksTablesContainer">
        </div>

    <div class="bottom-actions" id="exclude-bottom-actions">
        <button id="addWeekBtn" class="btn-success" style="font-size: 16px; padding: 12px 24px;" onclick="addNextWeek()">➕ Add Week 2</button>
    </div>
</div>

<script>
    // State management
    let syllabusData = {
        courseName: "NUXXX: Enter Course Title",
        showClinicalColumn: false,
        weeksRevealed: 1,
        weeks: []
    };

    const TOTAL_WEEKS = 8;
    const coreAssignments = ['Discussion', 'Quiz', 'Case Studies', 'Sherpath Assignment', 'HESI Exam'];

    // Blueprint for creating a fresh week block object (subtitle only — week number is auto)
    function createNewWeekObject() {
        return {
            subtitle: "",
            objectives: [],
            modules: [],
            readings: [],
            customCategories: [],
            clinicalActivities: [],
            assignments: [...coreAssignments]
        };
    }

    // Returns the display number for a week (1-based)
    function weekNum(weekIndex) { return weekIndex + 1; }

    // Returns the objective tag for a given week/obj index e.g. "2-3"
    function objTag(weekIndex, objIndex) { return `${weekNum(weekIndex)}-${objIndex + 1}`; }

    // Initialization
    window.onload = function() {
        if(localStorage.getItem('nursingSyllabusData')) {
            syllabusData = JSON.parse(localStorage.getItem('nursingSyllabusData'));
            if (syllabusData.showClinicalColumn === undefined) syllabusData.showClinicalColumn = false;
            if (syllabusData.weeksRevealed === undefined) syllabusData.weeksRevealed = syllabusData.weeks.length || 1;

            // Migrate old weekTitle → subtitle
            syllabusData.weeks.forEach(w => {
                if (w.weekTitle !== undefined) {
                    // Extract subtitle: strip leading "Week N" or "Week N:" prefix if present
                    w.subtitle = w.weekTitle.replace(/^Week\s*\d+\s*:?\s*/i, '').trim();
                    delete w.weekTitle;
                }
                if(!w.subtitle) w.subtitle = "";
                if(!w.objectives) w.objectives = [];
                if(!w.assignments) w.assignments = [...coreAssignments];
                if(!w.customCategories) w.customCategories = [];
                if(!w.clinicalActivities) w.clinicalActivities = [];
            });

            // Ensure exactly 8 weeks exist in data
            while (syllabusData.weeks.length < TOTAL_WEEKS) syllabusData.weeks.push(createNewWeekObject());
            syllabusData.weeks = syllabusData.weeks.slice(0, TOTAL_WEEKS);

            saveToStorage();
        } else {
            // Fresh start: pre-populate all 8 weeks, reveal only week 1
            for (let i = 0; i < TOTAL_WEEKS; i++) syllabusData.weeks.push(createNewWeekObject());
            syllabusData.weeksRevealed = 1;
        }
        updateUiWidth();
        renderAll();
    };

    function saveToStorage() {
        localStorage.setItem('nursingSyllabusData', JSON.stringify(syllabusData));
    }

    function updateUiWidth() {
        const container = document.getElementById('syllabusContentContainer');
        const toggleBtn = document.getElementById('columnToggleBtn');
        if(syllabusData.showClinicalColumn) {
            container.style.maxWidth = '1400px';
            if(toggleBtn) toggleBtn.innerHTML = "Remove Clinical Column";
        } else {
            container.style.maxWidth = '1200px';
            if(toggleBtn) toggleBtn.innerHTML = "Add Clinical Column";
        }
    }

    function toggleClinicalColumn() {
        syllabusData.showClinicalColumn = !syllabusData.showClinicalColumn;
        saveToStorage();
        updateUiWidth();
        renderAll();
    }

    function renderAll() {
        renderCourseName(false);
        
        const container = document.getElementById('weeksTablesContainer');
        container.innerHTML = '';

        const hasClinical = syllabusData.showClinicalColumn;
        const colWidthStyle = hasClinical ? "width: 33.33%;" : "width: 50%;";
        const headerSpanCount = hasClinical ? 3 : 2;

        const revealed = syllabusData.weeksRevealed;

        for (let weekIndex = 0; weekIndex < revealed; weekIndex++) {
            const week = syllabusData.weeks[weekIndex];
            const wNum = weekNum(weekIndex);

            const tableElement = document.createElement('table');
            tableElement.className = 'syllabus-table';
            tableElement.id = `table-week-${weekIndex}`;
            
            let tableHeaderRow = `
                <tr>
                    <td colspan="${headerSpanCount}" class="week-heading">
                        <div id="weekTitleContainer-${weekIndex}"></div>
                    </td>
                </tr>
                <tr>
                    <th style="background-color: #005A9C; color: white; ${colWidthStyle}">Learning Activities</th>
                    <th style="background-color: #005A9C; color: white; ${colWidthStyle}">Assignments</th>
                    ${hasClinical ? `<th class="clinical-th-cell" style="background-color: #008080; color: white; ${colWidthStyle}">Clinical/Lab Activities</th>` : ''}
                </tr>
            `;

            let tableBodyRow = `
                <tr>
                    <td style="${colWidthStyle}">
                        <div class="sub-section-title"><span>Week ${wNum} Objectives</span></div>
                        <div id="objectivesList-${weekIndex}" class="list-container"></div>
                        <div class="interactive-field" data-html-clean="remove">
                            <input type="text" id="newObjectiveInput-${weekIndex}" placeholder="Add an Objective...">
                            <button class="btn-primary" onclick="addItem(${weekIndex}, 'objectivesList', 'newObjectiveInput-${weekIndex}')">+ Add</button>
                        </div>

                        <div class="sub-section-title" style="margin-top: 30px;"><span>Learning Module(s)</span></div>
                        <div id="modulesList-${weekIndex}" class="list-container"></div>
                        <div class="interactive-field" data-html-clean="remove">
                            <input type="text" id="newModuleInput-${weekIndex}" placeholder="Add a Learning Module...">
                            <button class="btn-primary" onclick="addItem(${weekIndex}, 'modulesList', 'newModuleInput-${weekIndex}')">+ Add</button>
                        </div>

                        <div class="sub-section-title" style="margin-top: 30px;"><span>Readings</span></div>
                        <div id="readingsList-${weekIndex}" class="list-container"></div>
                        <div class="interactive-field" data-html-clean="remove">
                            <input type="text" id="newReadingInput-${weekIndex}" placeholder="Add Textbook Chapters / Articles...">
                            <button class="btn-primary" onclick="addItem(${weekIndex}, 'readingsList', 'newReadingInput-${weekIndex}')">+ Add</button>
                        </div>

                        <div id="customCategoriesArea-${weekIndex}"></div>

                        <div class="interactive-field" data-html-clean="remove" style="margin-top: 35px; border-top: 1px solid #ddd; padding-top: 15px;">
                            <input type="text" id="newCategoryTitleInput-${weekIndex}" placeholder="Create custom heading (e.g., Skills Lab)...">
                            <button class="btn-success" onclick="addCustomCategory(${weekIndex})">➕ Add Custom Category</button>
                        </div>
                    </td>

                    <td style="${colWidthStyle}">
                        <div id="assignmentsList-${weekIndex}" class="list-container" style="margin-top: 10px;"></div>
                        <div class="interactive-field" data-html-clean="remove">
                            <input type="text" id="newAssignmentInput-${weekIndex}" placeholder="Add an Assignment...">
                            <button class="btn-primary" onclick="addItem(${weekIndex}, 'assignmentsList', 'newAssignmentInput-${weekIndex}')">+ Add</button>
                        </div>

                        <div id="restorePanel-${weekIndex}" class="restore-panel" data-html-clean="remove" style="display: none;">
                            <span style="font-size: 11px; font-weight: bold; color: #856404;">Add Back Standard Item:</span>
                            <div id="restoreButtonsContainer-${weekIndex}" class="restore-buttons"></div>
                        </div>
                    </td>

                    ${hasClinical ? `
                    <td style="${colWidthStyle}">
                        <div id="clinicalActivitiesList-${weekIndex}" class="list-container" style="margin-top: 10px;"></div>
                        <div class="interactive-field" data-html-clean="remove">
                            <input type="text" id="newClinicalInput-${weekIndex}" placeholder="Add a Clinical/Lab Entry...">
                            <button class="btn-primary" style="background-color: var(--clinical-color);" onclick="addItem(${weekIndex}, 'clinicalActivitiesList', 'newClinicalInput-${weekIndex}')">+ Add</button>
                        </div>
                    </td>
                    ` : ''}
                </tr>
                <tr data-html-clean="remove">
                    <td colspan="${headerSpanCount}" style="background: #fafafa; text-align: right; padding: 8px 15px;">
                        <button class="btn-secondary" style="padding: 4px 10px; font-size: 11px;" onclick="resetWeekSection(${weekIndex})">↺ Reset Week ${wNum}</button>
                    </td>
                </tr>
            `;

            tableElement.innerHTML = `<thead>${tableHeaderRow}</thead><tbody>${tableBodyRow}</tbody>`;
            container.appendChild(tableElement);

            renderWeekTitle(weekIndex, false);
            renderDynamicList(weekIndex, 'objectivesList', week.objectives);
            renderDynamicList(weekIndex, 'modulesList', week.modules);
            renderDynamicList(weekIndex, 'readingsList', week.readings);
            renderDynamicList(weekIndex, 'assignmentsList', week.assignments);
            renderCustomCategories(weekIndex);
            renderRestorePanel(weekIndex);

            if(hasClinical) {
                renderDynamicList(weekIndex, 'clinicalActivitiesList', week.clinicalActivities);
            }
        }

        // Update the "Add Week" button
        const addBtn = document.getElementById('addWeekBtn');
        if (addBtn) {
            if (revealed < TOTAL_WEEKS) {
                addBtn.style.display = 'inline-block';
                addBtn.textContent = `➕ Add Week ${revealed + 1}`;
            } else {
                addBtn.style.display = 'none';
            }
        }
    }

    function renderRestorePanel(weekIndex) {
        const panel = document.getElementById(`restorePanel-${weekIndex}`);
        const container = document.getElementById(`restoreButtonsContainer-${weekIndex}`);
        const currentAssignments = syllabusData.weeks[weekIndex].assignments;
        
        container.innerHTML = '';
        let missingCoreItems = coreAssignments.filter(item => !currentAssignments.includes(item));

        if (missingCoreItems.length > 0) {
            panel.style.display = 'block';
            missingCoreItems.forEach(itemName => {
                const btn = document.createElement('button');
                btn.className = 'btn-success';
                btn.style.padding = '2px 8px';
                btn.style.fontSize = '11px';
                btn.innerText = `+ ${itemName}`;
                btn.onclick = function() {
                    syllabusData.weeks[weekIndex].assignments.push(itemName);
                    saveToStorage();
                    renderAll();
                };
                container.appendChild(btn);
            });
        } else {
            panel.style.display = 'none';
        }
    }

    // Dynamic Category Handling Logic
    function addCustomCategory(weekIndex) {
        const input = document.getElementById(`newCategoryTitleInput-${weekIndex}`);
        const title = input.value.trim();
        if(!title) return;

        syllabusData.weeks[weekIndex].customCategories.push({
            name: title,
            items: []
        });

        input.value = '';
        saveToStorage();
        renderAll();
    }

    function deleteCustomCategory(weekIndex, catIndex) {
        if(confirm("Delete this category heading and all items under it?")) {
            syllabusData.weeks[weekIndex].customCategories.splice(catIndex, 1);
            saveToStorage();
            renderAll();
        }
    }

    function renderCustomCategories(weekIndex) {
        const targetArea = document.getElementById(`customCategoriesArea-${weekIndex}`);
        targetArea.innerHTML = '';
        const week = syllabusData.weeks[weekIndex];

        week.customCategories.forEach((cat, catIndex) => {
            const catWrapper = document.createElement('div');
            catWrapper.style.marginTop = '30px';
            
            catWrapper.innerHTML = `
                <div class="sub-section-title">
                    <span>${escapeHtml(cat.name)}</span>
                    <button class="btn-danger" data-html-clean="remove" style="padding: 2px 6px; font-size: 10px; font-weight: normal;" onclick="deleteCustomCategory(${weekIndex}, ${catIndex})">Delete Category</button>
                </div>
                <div id="customCatList-${weekIndex}-${catIndex}" class="list-container"></div>
                <div class="interactive-field" data-html-clean="remove">
                    <input type="text" id="newCustomCatItemInput-${weekIndex}-${catIndex}" placeholder="Add entry under ${escapeHtml(cat.name)}...">
                    <button class="btn-primary" onclick="addCustomCategoryItem(${weekIndex}, ${catIndex})">+ Add</button>
                </div>
            `;
            targetArea.appendChild(catWrapper);
            renderCustomCategoryItemsList(weekIndex, catIndex);
        });
    }

    function renderCustomCategoryItemsList(weekIndex, catIndex) {
        const container = document.getElementById(`customCatList-${weekIndex}-${catIndex}`);
        container.innerHTML = '';
        const arrayData = syllabusData.weeks[weekIndex].customCategories[catIndex].items;
        const week = syllabusData.weeks[weekIndex];
        const mappingsKey = `customCat_${catIndex}_mappings`;
        if (!week[mappingsKey]) week[mappingsKey] = {};

        arrayData.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.id = `customCat-row-${weekIndex}-${catIndex}-${index}`;
            const mappedWOs = week[mappingsKey][index] || [];
            const parenthetical = mappedWOs.length > 0
                ? ` <span style="color:#888; font-size:11px;">(${mappedWOs.join(', ')})</span>`
                : '';
            row.innerHTML = `
                <div style="flex-grow:1;">
                    <span class="item-text">${escapeHtml(item)}</span>${parenthetical}
                </div>
                <div data-html-clean="remove" style="display:flex; gap:4px; align-items:center; flex-shrink:0;">
                    <button class="btn-secondary" style="padding:2px 6px; font-size:12px;" onclick="editCustomCategoryItem(${weekIndex}, ${catIndex}, ${index})">Edit</button>
                    <button class="btn-map" onclick="showMapPopover(${weekIndex}, 'customCat_${catIndex}', ${index}, this)">Map</button>
                    <button class="btn-danger" style="padding:2px 6px; font-size:12px;" onclick="deleteCustomCategoryItem(${weekIndex}, ${catIndex}, ${index})">Delete</button>
                </div>
            `;
            container.appendChild(row);
        });
    }

    function addCustomCategoryItem(weekIndex, catIndex) {
        const input = document.getElementById(`newCustomCatItemInput-${weekIndex}-${catIndex}`);
        const value = input.value.trim();
        if(!value) return;

        syllabusData.weeks[weekIndex].customCategories[catIndex].items.push(value);
        input.value = '';
        saveToStorage();
        renderAll();
    }

    function editCustomCategoryItem(weekIndex, catIndex, index) {
        const row = document.getElementById(`customCat-row-${weekIndex}-${catIndex}-${index}`);
        const currentVal = syllabusData.weeks[weekIndex].customCategories[catIndex].items[index];

        row.innerHTML = `
            <input type="text" id="customCat-edit-input-${weekIndex}-${catIndex}-${index}" value="${escapeHtml(currentVal)}" style="margin-right:8px;">
            <div>
                <button class="btn-success" style="padding:2px 6px; font-size:12px;" onclick="saveCustomCategoryItem(${weekIndex}, ${catIndex}, ${index})">Save</button>
                <button class="btn-secondary" style="padding:2px 6px; font-size:12px;" onclick="renderAll()">Cancel</button>
            </div>
        `;
    }

    function saveCustomCategoryItem(weekIndex, catIndex, index) {
        const newVal = document.getElementById(`customCat-edit-input-${weekIndex}-${catIndex}-${index}`).value.trim();
        if(!newVal) return;

        syllabusData.weeks[weekIndex].customCategories[catIndex].items[index] = newVal;
        saveToStorage();
        renderAll();
    }

    function deleteCustomCategoryItem(weekIndex, catIndex, index) {
        syllabusData.weeks[weekIndex].customCategories[catIndex].items.splice(index, 1);
        saveToStorage();
        renderAll();
    }

    function addNextWeek() {
        if (syllabusData.weeksRevealed < TOTAL_WEEKS) {
            syllabusData.weeksRevealed++;
            saveToStorage();
            renderAll();
            // Scroll the new week into view
            const newTable = document.getElementById(`table-week-${syllabusData.weeksRevealed - 1}`);
            if (newTable) newTable.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    function resetWeekSection(weekIndex) {
        const wNum = weekNum(weekIndex);
        if(confirm(`Reset Week ${wNum}? This will clear all objectives, modules, readings, assignments, and custom categories for this week.`)) {
            syllabusData.weeks[weekIndex] = createNewWeekObject();
            saveToStorage();
            renderAll();
        }
    }

    function renderCourseName(isEditing) {
        const container = document.getElementById('courseNameContainer');
        if (isEditing) {
            container.innerHTML = `
                <div class="interactive-field">
                    <input type="text" id="courseNameInput" value="${escapeHtml(syllabusData.courseName)}">
                    <button class="btn-success" onclick="saveCourseName()">Save</button>
                    <button class="btn-secondary" onclick="renderCourseName(false)">Cancel</button>
                </div>
            `;
        } else {
            container.innerHTML = `
                <div class="display-mode">
                    <span>${syllabusData.courseName || '<em>No course name specified</em>'}</span>
                    <button class="btn-secondary" data-html-clean="remove" style="padding: 2px 8px; font-size:12px;" onclick="renderCourseName(true)">Edit</button>
                    <button class="btn-danger" data-html-clean="remove" style="padding: 2px 8px; font-size:12px;" onclick="deleteCourseName()">Delete</button>
                </div>
            `;
        }
    }

    function saveCourseName() {
        const val = document.getElementById('courseNameInput').value;
        syllabusData.courseName = val.trim() || "Untitled Nursing Course";
        saveToStorage();
        renderCourseName(false);
    }

    function deleteCourseName() {
        syllabusData.courseName = "";
        saveToStorage();
        renderCourseName(false);
    }

    function renderWeekTitle(weekIndex, isEditing) {
        const container = document.getElementById(`weekTitleContainer-${weekIndex}`);
        const wNum = weekNum(weekIndex);
        const subtitle = syllabusData.weeks[weekIndex].subtitle || '';
        const displayTitle = subtitle ? `Week ${wNum}: ${subtitle}` : `Week ${wNum}`;

        if (isEditing) {
            container.innerHTML = `
                <div class="interactive-field" style="margin-bottom:0;">
                    <span style="font-size:1.2em; font-weight:bold; white-space:nowrap; margin-right:4px;">Week ${wNum}:</span>
                    <input type="text" id="weekSubtitleInput-${weekIndex}" value="${escapeHtml(subtitle)}" placeholder="Optional subtitle (e.g. Cardiac Care)" style="padding: 4px 8px;">
                    <button class="btn-success" style="padding: 4px 10px; font-size:12px;" onclick="saveWeekTitle(${weekIndex})">Save</button>
                    <button class="btn-secondary" style="padding: 4px 10px; font-size:12px;" onclick="renderWeekTitle(${weekIndex}, false)">Cancel</button>
                </div>
            `;
        } else {
            container.innerHTML = `
                <div style="display:flex; justify-content: space-between; align-items:center; width:100%;">
                    <span style="font-size: 1.2em; font-weight: bold;">${escapeHtml(displayTitle)}</span>
                    <div data-html-clean="remove">
                        <button class="btn-secondary" style="padding: 2px 8px; font-size:11px; color:#333; background:#fff; border:1px solid #ccc;" onclick="renderWeekTitle(${weekIndex}, true)">Edit</button>
                    </div>
                </div>
            `;
        }
    }

    function saveWeekTitle(weekIndex) {
        const val = document.getElementById(`weekSubtitleInput-${weekIndex}`).value;
        syllabusData.weeks[weekIndex].subtitle = val.trim();
        saveToStorage();
        renderWeekTitle(weekIndex, false);
    }

    function renderDynamicList(weekIndex, containerType, arrayData) {
        const container = document.getElementById(`${containerType}-${weekIndex}`);
        container.innerHTML = '';
        const isObjectives = (containerType === 'objectivesList');

        arrayData.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.id = `${containerType}-${weekIndex}-row-${index}`;

            if (isObjectives) {
                // Show X-N tag + text; no Map button for objectives themselves
                const tag = objTag(weekIndex, index);
                row.innerHTML = `
                    <span class="wo-tag">${tag}</span>
                    <span class="item-text">${escapeHtml(item)}</span>
                    <div data-html-clean="remove">
                        <button class="btn-secondary" style="padding:2px 6px; font-size:12px;" onclick="editListItem(${weekIndex}, '${containerType}', ${index})">Edit</button>
                        <button class="btn-danger" style="padding:2px 6px; font-size:12px;" onclick="deleteListItem(${weekIndex}, '${containerType}', ${index})">Delete</button>
                    </div>
                `;
            } else {
                // Show mapped WO badges + Map button between Edit/Delete
                const week = syllabusData.weeks[weekIndex];
                const mappingsKey = `${containerType}_mappings`;
                if (!week[mappingsKey]) week[mappingsKey] = {};
                const mappedWOs = week[mappingsKey][index] || [];
                const parenthetical = mappedWOs.length > 0
                    ? ` <span style="color:#888; font-size:11px;">(${mappedWOs.join(', ')})</span>`
                    : '';

                row.innerHTML = `
                    <div style="flex-grow:1;">
                        <span class="item-text">${escapeHtml(item)}</span>${parenthetical}
                    </div>
                    <div data-html-clean="remove" style="display:flex; gap:4px; align-items:center; flex-shrink:0;">
                        <button class="btn-secondary" style="padding:2px 6px; font-size:12px;" onclick="editListItem(${weekIndex}, '${containerType}', ${index})">Edit</button>
                        <button class="btn-map" onclick="showMapPopover(${weekIndex}, '${containerType}', ${index}, this)">Map</button>
                        <button class="btn-danger" style="padding:2px 6px; font-size:12px;" onclick="deleteListItem(${weekIndex}, '${containerType}', ${index})">Delete</button>
                    </div>
                `;
            }
            container.appendChild(row);
        });
    }

    function addItem(weekIndex, containerType, inputId) {
        const input = document.getElementById(inputId);
        const value = input.value.trim();
        if(!value) return;

        const week = syllabusData.weeks[weekIndex];
        if(containerType === 'objectivesList') week.objectives.push(value);
        if(containerType === 'modulesList') week.modules.push(value);
        if(containerType === 'readingsList') week.readings.push(value);
        if(containerType === 'assignmentsList') week.assignments.push(value);
        if(containerType === 'clinicalActivitiesList') week.clinicalActivities.push(value);

        input.value = '';
        saveToStorage();
        renderAll();
    }

    function editListItem(weekIndex, containerType, index) {
        const row = document.getElementById(`${containerType}-${weekIndex}-row-${index}`);
        const week = syllabusData.weeks[weekIndex];
        let currentVal = "";
        
        if(containerType === 'objectivesList') currentVal = week.objectives[index];
        if(containerType === 'modulesList') currentVal = week.modules[index];
        if(containerType === 'readingsList') currentVal = week.readings[index];
        if(containerType === 'assignmentsList') currentVal = week.assignments[index];
        if(containerType === 'clinicalActivitiesList') currentVal = week.clinicalActivities[index];

        row.innerHTML = `
            <input type="text" id="${containerType}-${weekIndex}-edit-input-${index}" value="${escapeHtml(currentVal)}" style="margin-right:8px;">
            <div>
                <button class="btn-success" style="padding:2px 6px; font-size:12px;" onclick="saveListItem(${weekIndex}, '${containerType}', ${index})">Save</button>
                <button class="btn-secondary" style="padding:2px 6px; font-size:12px;" onclick="renderAll()">Cancel</button>
            </div>
        `;
    }

    function saveListItem(weekIndex, containerType, index) {
        const newVal = document.getElementById(`${containerType}-${weekIndex}-edit-input-${index}`).value.trim();
        if(!newVal) return;

        const week = syllabusData.weeks[weekIndex];
        if(containerType === 'objectivesList') week.objectives[index] = newVal;
        if(containerType === 'modulesList') week.modules[index] = newVal;
        if(containerType === 'readingsList') week.readings[index] = newVal;
        if(containerType === 'assignmentsList') week.assignments[index] = newVal;
        if(containerType === 'clinicalActivitiesList') week.clinicalActivities[index] = newVal;

        saveToStorage();
        renderAll();
    }

    function deleteListItem(weekIndex, containerType, index) {
        const week = syllabusData.weeks[weekIndex];
        if(containerType === 'objectivesList') {
            week.objectives.splice(index, 1);
            // Re-index all mappings in this week: remove deleted tag, shift higher ones down
            const wNum = weekNum(weekIndex);
            const deletedTag = `${wNum}-${index + 1}`;
            const mappingKeys = Object.keys(week).filter(k => k.endsWith('_mappings'));
            mappingKeys.forEach(mk => {
                const store = week[mk];
                Object.keys(store).forEach(itemIdx => {
                    store[itemIdx] = store[itemIdx]
                        .filter(tag => tag !== deletedTag)
                        .map(tag => {
                            // e.g. "2-3" → split on "-"
                            const parts = tag.split('-');
                            if (parts.length === 2 && parseInt(parts[0]) === wNum) {
                                const n = parseInt(parts[1]);
                                if (n > index + 1) return `${wNum}-${n - 1}`;
                            }
                            return tag;
                        });
                });
            });
        } else if(containerType === 'modulesList') week.modules.splice(index, 1);
        else if(containerType === 'readingsList') week.readings.splice(index, 1);
        else if(containerType === 'assignmentsList') week.assignments.splice(index, 1);
        else if(containerType === 'clinicalActivitiesList') week.clinicalActivities.splice(index, 1);

        // Compact mappings for the affected list (shift indices down for items after deleted one)
        if (containerType !== 'objectivesList') {
            const mappingsKey = `${containerType}_mappings`;
            if (week[mappingsKey]) {
                const newStore = {};
                Object.keys(week[mappingsKey]).forEach(k => {
                    const n = parseInt(k);
                    if (n < index) newStore[n] = week[mappingsKey][k];
                    else if (n > index) newStore[n - 1] = week[mappingsKey][k];
                });
                week[mappingsKey] = newStore;
            }
        }

        saveToStorage();
        renderAll();
    }

    // WORD DOCUMENT EXPORT COMPILER
    function exportToWord() {
        renderAll();

        const clone = document.getElementById('syllabusContentContainer').cloneNode(true);

        clone.querySelector('#exclude-toolbar').remove();
        clone.querySelector('#exclude-column-toggle-zone').remove();
        clone.querySelector('#exclude-bottom-actions').remove();
        clone.querySelectorAll('[data-html-clean="remove"]').forEach(el => el.remove());

        const hasClinical = syllabusData.showClinicalColumn;
        const colWidthPercent = hasClinical ? "33.33%" : "50%";

        const docHtmlStyles = `
            <style>
                body { font-family: 'Arial', sans-serif; color: #333333; }
                h1 { color: #005A9C; border-bottom: 2px solid #005A9C; padding-bottom: 5px; }
                .course-header-zone { margin-bottom: 20px; background: #fafafa; padding: 12px; border-left: 5px solid #005A9C; font-size: 14pt; font-weight: bold; }
                table { width: 100%; border-collapse: collapse; margin-top: 15px; table-layout: fixed; }
                th, td { border: 1px solid #cccccc; padding: 10px; vertical-align: top; width: ${colWidthPercent}; word-wrap: break-word; }
                th { background-color: #005A9C !important; color: white !important; font-weight: bold; text-align: left; }
                .week-heading { background-color: #dee2e6 !important; font-weight: bold; font-size: 13pt; color: #495057; }
                .sub-section-title { font-weight: bold; color: #005A9C; margin-top: 12px; margin-bottom: 4px; border-bottom: 1px dashed #cccccc; }
                .item-row { padding: 4px 0; border-bottom: 1px solid #f0f0f0; display: block; }
            </style>
        `;

        clone.querySelectorAll('.syllabus-table').forEach(table => {
            table.querySelectorAll('th, td').forEach(cell => {
                cell.style.width = colWidthPercent;
            });
            
            if (hasClinical) {
                table.querySelectorAll('.clinical-th-cell').forEach(th => {
                    th.setAttribute('style', `background-color: #008080 !important; color: white !important; font-weight: bold; text-align: left; width: ${colWidthPercent};`);
                });
            }
        });

        const completeDocHtml = `
            <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
            <head>
                <meta charset="utf-8">
                <title>Syllabus Export</title>
                ${docHtmlStyles}
            </head>
            <body>
                ${clone.innerHTML}
            </body>
            </html>
        `;

        const blob = new Blob(['\ufeff' + completeDocHtml], {
            type: 'application/msword'
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const cleanTitle = syllabusData.courseName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
        
        link.href = url;
        link.download = `syllabus_${cleanTitle || 'course'}.doc`;
        document.body.appendChild(link);
        link.click();
        
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    function showMapPopover(weekIndex, containerType, itemIndex, triggerBtn) {
        // Remove any existing popover
        const existing = document.getElementById('mapPopoverOverlay');
        if (existing) existing.remove();

        const week = syllabusData.weeks[weekIndex];
        const objectives = week.objectives;

        if (!objectives || objectives.length === 0) {
            alert("No objectives have been added to this week yet. Add objectives first.");
            return;
        }

        const mappingsKey = `${containerType}_mappings`;
        if (!week[mappingsKey]) week[mappingsKey] = {};
        const currentMappings = week[mappingsKey][itemIndex] ? [...week[mappingsKey][itemIndex]] : [];

        const overlay = document.createElement('div');
        overlay.className = 'map-popover-overlay';
        overlay.id = 'mapPopoverOverlay';

        const chipsHtml = objectives.map((obj, i) => {
            const tag = objTag(weekIndex, i);
            const isSelected = currentMappings.includes(tag);
            return `<button class="map-wo-chip${isSelected ? ' selected' : ''}" data-tag="${tag}" onclick="toggleWoChip(this)">${tag}</button>`;
        }).join('');

        overlay.innerHTML = `
            <div class="map-popover">
                <h3>Map to Weekly Objectives</h3>
                <p>Select which objectives this item relates to:</p>
                <div class="map-wo-options">${chipsHtml}</div>
                <div class="map-popover-actions">
                    <button class="btn-secondary" style="padding:5px 14px; font-size:13px;" onclick="document.getElementById('mapPopoverOverlay').remove()">Cancel</button>
                    <button class="btn-primary" style="padding:5px 14px; font-size:13px;" onclick="saveMapping(${weekIndex}, '${containerType}', ${itemIndex})">Save</button>
                </div>
            </div>
        `;

        // Close on overlay click (outside popover)
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) overlay.remove();
        });

        document.body.appendChild(overlay);
    }

    function toggleWoChip(btn) {
        btn.classList.toggle('selected');
    }

    function saveMapping(weekIndex, containerType, itemIndex) {
        const overlay = document.getElementById('mapPopoverOverlay');
        const selectedChips = overlay.querySelectorAll('.map-wo-chip.selected');
        const selected = Array.from(selectedChips).map(c => c.dataset.tag);

        const week = syllabusData.weeks[weekIndex];
        const mappingsKey = `${containerType}_mappings`;
        if (!week[mappingsKey]) week[mappingsKey] = {};
        week[mappingsKey][itemIndex] = selected;

        overlay.remove();
        saveToStorage();
        renderAll();
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>
